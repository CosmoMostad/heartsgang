name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: heartsgang-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Engine and server tests
        run: npm test
      - run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Package release
        run: tar -czf release.tgz -C dist/release .
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tgz
          retention-days: 14

  deploy:
    name: Deploy to AWS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Read deploy settings
        id: cfg
        env:
          ROLE_VAR: ${{ vars.AWS_ROLE_ARN }}
        run: |
          ROLE=$(jq -r '.awsRoleArn // ""' deploy/config.json)
          [ -n "$ROLE_VAR" ] && ROLE="$ROLE_VAR"
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"
          echo "region=$(jq -r '.region // "us-east-1"' deploy/config.json)" >> "$GITHUB_OUTPUT"
          echo "domain=$(jq -r '.domain // "heartsgang.net"' deploy/config.json)" >> "$GITHUB_OUTPUT"
          if [ -z "$ROLE" ]; then
            echo "::notice title=Deploy skipped::No AWS role yet. Put the role ARN in deploy/config.json (see deploy/README.md) and push."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.cfg.outputs.skip != 'true'
        run: npm ci

      - uses: actions/download-artifact@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          name: release

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          role-to-assume: ${{ steps.cfg.outputs.role }}
          aws-region: ${{ steps.cfg.outputs.region }}
          role-session-name: heartsgang-deploy

      - name: Find the DNS zone
        id: zone
        if: steps.cfg.outputs.skip != 'true'
        env:
          DOMAIN: ${{ steps.cfg.outputs.domain }}
        run: |
          ZONE=$(aws route53 list-hosted-zones-by-name --dns-name "$DOMAIN" --query "HostedZones[?Name=='$DOMAIN.'].Id | [0]" --output text)
          if [ -z "$ZONE" ] || [ "$ZONE" = "None" ]; then
            echo "::error title=No DNS zone::There is no Route 53 hosted zone for $DOMAIN. Run deploy/setup-aws.sh in AWS CloudShell."
            exit 1
          fi
          echo "id=${ZONE##*/}" >> "$GITHUB_OUTPUT"
          echo "Nameservers AWS expects for $DOMAIN:"
          aws route53 get-hosted-zone --id "${ZONE##*/}" --query DelegationSet.NameServers --output text

      - name: Prepare CDK in this account (no-op after the first run)
        if: steps.cfg.outputs.skip != 'true'
        working-directory: infra
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          npx cdk bootstrap "aws://$ACCOUNT/${{ steps.cfg.outputs.region }}" -c zoneId=${{ steps.zone.outputs.id }} -c domain=${{ steps.cfg.outputs.domain }}

      - name: Deploy infrastructure
        if: steps.cfg.outputs.skip != 'true'
        working-directory: infra
        run: npx cdk deploy HeartsGang --require-approval never -c zoneId=${{ steps.zone.outputs.id }} -c domain=${{ steps.cfg.outputs.domain }} --outputs-file ../cdk-outputs.json

      - name: Upload the release
        if: steps.cfg.outputs.skip != 'true'
        run: |
          BUCKET=$(jq -r '.HeartsGang.ReleaseBucket' cdk-outputs.json)
          aws s3 cp release.tgz "s3://$BUCKET/releases/$GITHUB_SHA.tgz"
          aws s3 cp release.tgz "s3://$BUCKET/releases/latest.tgz"

      - name: Install it on the server
        if: steps.cfg.outputs.skip != 'true'
        run: |
          ID=$(jq -r '.HeartsGang.InstanceId' cdk-outputs.json)
          echo "Waiting for the server ($ID) to check in with AWS..."
          for i in $(seq 1 90); do
            PING=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$ID" --query 'InstanceInformationList[0].PingStatus' --output text)
            [ "$PING" = "Online" ] && break
            sleep 10
          done
          [ "$PING" = "Online" ] || { echo "::error::The server never came online in Systems Manager."; exit 1; }
          cat > ssm-params.json <<JSON
          {"commands": ["timeout 900 bash -c 'until [ -f /var/lib/cloud/instance/boot-finished ]; do sleep 5; done'", "/usr/local/bin/heartsgang-deploy releases/${GITHUB_SHA}.tgz"], "executionTimeout": ["1200"]}
          JSON
          CMD=$(aws ssm send-command --instance-ids "$ID" --document-name AWS-RunShellScript --comment "Deploy ${GITHUB_SHA::7}" --parameters file://ssm-params.json --query Command.CommandId --output text)
          STATUS=Pending
          for i in $(seq 1 250); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" --query StandardOutputContent --output text || true
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" --query StandardErrorContent --output text || true
          [ "$STATUS" = "Success" ] || { echo "::error::Install on the server ended with status $STATUS."; exit 1; }

      - name: Check the live site
        if: steps.cfg.outputs.skip != 'true'
        env:
          DOMAIN: ${{ steps.cfg.outputs.domain }}
        run: |
          IP=$(jq -r '.HeartsGang.PublicIpAddress' cdk-outputs.json)
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://$DOMAIN/health"; then echo; echo "Live at https://$DOMAIN"; exit 0; fi
            sleep 10
          done
          echo "::warning title=HTTPS not answering yet::The game server is installed and healthy, but https://$DOMAIN is not reachable yet. Usually DNS has not switched over: set the domain's nameservers to the ones printed in 'Find the DNS zone'. Server IP: $IP"
